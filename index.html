<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VeloVault">
<meta name="theme-color" content="#F7F8F4">
<title>VeloVault Demo</title>
<style>
:root{
  --navy:#0B1F33;--teal:#1C7293;--mint:#5FD4C0;--bg:#F7F8F4;--card:#FFFFFF;
  --line:#E2E8EA;--muted:#5C6C79;--soft:#EEF3F2;--green:#13865A;--greenbg:#E3F6EE;
  --danger:#B93C3C;--dangerbg:#FBEAEA;--warn:#9A5B00;--warnbg:#FFF3DC;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--navy);
  background:radial-gradient(circle at 30% 20%,#FFFFFF 0,#E9EDE7 65%);min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
.stage{display:flex;flex-direction:column;align-items:center;padding:30px 10px}
.stage-caption{margin-top:16px;font-size:13px;color:var(--muted);text-align:center}
.phone{position:relative;width:414px;height:868px;padding:12px;border-radius:58px;background:#101820;
  box-shadow:0 0 0 2px #2a3640,0 30px 80px rgba(11,31,51,.35);transform-origin:top center;flex:none}
.screen{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.notch{position:absolute;top:11px;left:50%;width:118px;height:34px;margin-left:-59px;border-radius:20px;background:#101820;z-index:60;pointer-events:none}
.statusbar{flex:none;height:54px;display:flex;align-items:center;justify-content:space-between;padding:8px 30px 0 38px;font-size:15px;font-weight:600}
.sb-icons{display:flex;gap:6px;align-items:center}
.demo-strip{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 10px 6px 16px}
.demo-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--teal);background:rgba(28,114,147,.09);
  border:1px solid rgba(28,114,147,.22);padding:5px 10px;border-radius:999px}
.demo-pill i{width:6px;height:6px;border-radius:50%;background:var(--teal);display:inline-block}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:none;background:transparent;border-radius:12px;flex:none}
.icon-btn:active{background:rgba(11,31,51,.08)}
.menu-btn{background:#fff;border:1px solid var(--line)}
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative;overscroll-behavior:none}
.pad{padding:6px 20px 28px}
.muted{color:var(--muted)}
.small{font-size:13px;line-height:1.45}
.center{text-align:center}
.tabbar{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);padding:4px 6px 10px}
.tabbar.hidden{display:none}
.tab{flex:1;min-height:54px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:#8795A1}
.tab.active{color:var(--teal)}

/* Buttons & fields */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:14px;border:none;font-size:16px;font-weight:700;background:var(--teal);color:#fff;padding:0 18px}
.btn+.btn{margin-top:10px}
.btn:active{filter:brightness(.9)}
.btn.outline{background:#fff;color:var(--teal);border:2px solid var(--teal)}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid #CBD6DC}
.btn.dark{background:var(--navy)}
.btn.mint{background:var(--mint);color:var(--navy)}
.btn.sm{width:auto;min-height:44px;padding:0 16px;font-size:14px;border-radius:12px}
.link{border:none;background:none;color:var(--teal);font-weight:700;font-size:14px;min-height:44px;min-width:44px;padding:0 4px}
.field{width:100%;min-height:54px;border-radius:14px;border:1.5px solid #CBD6DC;background:#fff;padding:0 16px;font-size:17px;color:var(--navy);outline:none}
.field:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(28,114,147,.15)}
.field-label{display:block;font-size:13px;font-weight:800;margin:18px 0 8px}
.err{color:var(--danger);font-size:13.5px;margin:8px 2px 0;font-weight:600}
.sub-head{display:flex;align-items:center;gap:2px;margin:0 0 6px -10px}
.sub-head h2{font-size:21px;margin:0}
.page-title{font-size:24px;margin:4px 0 4px;letter-spacing:-.01em}

/* Onboarding / sign in */
.ob{min-height:100%;display:flex;flex-direction:column;padding:4px 24px 28px}
.ob-top{display:flex;justify-content:space-between;align-items:center}
.ob-art{flex:1;display:flex;align-items:center;justify-content:center;min-height:240px}
.ob-circle{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--mint),var(--teal) 72%);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 20px 50px rgba(28,114,147,.3)}
.ob-step{font-size:12px;font-weight:800;color:var(--teal);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.ob h1{font-size:27px;line-height:1.2;margin:0 0 10px;letter-spacing:-.01em}
.ob p{font-size:16px;line-height:1.5;color:var(--muted);margin:0 0 22px}
.dots{display:flex;gap:8px;margin-bottom:22px}
.dots i{width:8px;height:8px;border-radius:99px;background:#C8D4DA;transition:width .2s}
.dots i.on{width:26px;background:var(--teal)}
.ob-actions{display:flex;gap:10px}
.ob-actions .btn{margin:0}
.ob-actions .btn.ghost{flex:0 0 110px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.logo-mark{width:40px;height:40px;border-radius:12px;background:var(--navy);color:var(--mint);display:flex;align-items:center;justify-content:center}
.signin{min-height:100%;display:flex;flex-direction:column;padding:10px 24px 28px}
.signin h1{font-size:27px;margin:34px 0 8px}
.signin p{color:var(--muted);line-height:1.5;margin:0}

/* Home */
.home-title{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:6px 0 10px}
.status-ok{display:inline-flex;align-items:center;gap:8px;background:var(--greenbg);color:var(--green);font-weight:800;font-size:14px;padding:8px 13px;border-radius:999px}
.status-ok .dot{width:9px;height:9px;border-radius:50%;background:#1DB97A;box-shadow:0 0 0 4px rgba(29,185,122,.18);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(29,185,122,.06)}}
.plan-card{display:block;width:100%;text-align:left;margin:16px 0 22px;background:linear-gradient(135deg,var(--navy),#14405F);color:#fff;border:none;border-radius:20px;padding:16px 18px;box-shadow:0 12px 30px rgba(11,31,51,.2)}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pc-top small{display:block;font-size:12px;opacity:.7;margin-bottom:3px}
.pc-top b{font-size:17px}
.days{text-align:right}
.days b{font-size:28px;line-height:1;display:block;color:var(--mint)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;margin:14px 0 8px}
.bar span{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .4s}
.bar.light{background:#E3EAED;margin:0}
.bar.light span{background:var(--teal)}
.bar.hi span{background:#E2A03F}
.bar.full span{background:var(--danger)}
.pc-foot{display:flex;justify-content:space-between;font-size:12.5px;opacity:.85}
.row-between{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}
.sec{font-size:17px;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{position:relative;min-height:106px;border-radius:20px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px 6px;box-shadow:0 1px 2px rgba(11,31,51,.05);transition:transform .1s;min-width:0}
.tile:active{transform:scale(.96)}
.tile-ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.tile-ic.sm{width:36px;height:36px;border-radius:11px}
.tile-name{font-size:13px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.tile.add{border:2px dashed #93A9B6;background:transparent;color:var(--teal);box-shadow:none}
.tile.add .tile-ic{border:2px dashed var(--teal)}
.tile-badge{position:absolute;top:7px;right:7px;font-size:9.5px;font-weight:800;background:var(--warnbg);color:var(--warn);padding:2px 6px;border-radius:99px}
.letter{font-weight:800;line-height:1}
.hint{font-size:13px;color:var(--muted);margin:16px 2px 0;line-height:1.45}

/* App view */
.app-wrap{min-height:100%;display:flex;flex-direction:column}
.app-top{position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 1px 0 var(--line)}
.app-head{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 2px}
.app-title{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.app-title>div{min-width:0}
.app-title b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-title small{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.app-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.chip{position:relative;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;background:var(--navy);color:#fff;padding:7px 10px;border-radius:99px;white-space:nowrap;flex:none}
.chip-plus{position:absolute;right:4px;top:-6px;font-size:11px;font-weight:800;color:var(--teal);opacity:0;pointer-events:none;white-space:nowrap}
.chip-plus.go{animation:floatup 1s ease-out}
@keyframes floatup{0%{opacity:1;transform:translateY(4px)}100%{opacity:0;transform:translateY(-18px)}}
.app-meter{height:4px;background:var(--soft)}
.app-meter span{display:block;height:100%;background:var(--mint);transition:width .3s}
.note-strip{display:flex;align-items:center;gap:8px;background:#E4F7F3;color:#0E6B5C;font-size:12.5px;font-weight:800;padding:8px 14px}
.note-strip.prem{background:#E8F1F6;color:var(--teal)}
.app-body{flex:1;display:flex;flex-direction:column}
.list-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 16px 8px}

/* Chat mock */
.chat-list{background:#fff;flex:1}
.chat-row{display:flex;align-items:center;gap:12px;width:100%;border:none;background:#fff;padding:12px 16px;border-bottom:1px solid var(--line);text-align:left;min-height:74px}
.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex:none;font-size:15px}
.avatar.sm{width:36px;height:36px;font-size:13px}
.cr-main{flex:1;min-width:0}
.cr-top{display:flex;justify-content:space-between;gap:8px}
.cr-top small{color:var(--muted);font-size:12px}
.cr-last{display:block;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.unread{min-width:22px;height:22px;border-radius:99px;background:var(--mint);color:var(--navy);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px}
.convo{flex:1;display:flex;flex-direction:column}
.convo-head{display:flex;align-items:center;gap:8px;padding:4px 6px;background:#F0F5F6;border-bottom:1px solid var(--line)}
.convo-name{flex:1;min-width:0}
.convo-name b{display:block;font-size:15px}
.convo-name small{color:var(--muted);font-size:12px}
.msgs{flex:1;padding:14px 12px 12px;display:flex;flex-direction:column;gap:8px;background:#EAF1EF;min-height:360px}
.bubble{max-width:78%;padding:9px 12px;border-radius:16px;border-top-left-radius:4px;font-size:15px;line-height:1.35;background:#fff;align-self:flex-start;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.bubble.me{align-self:flex-end;background:#CDEFE8;border-top-left-radius:16px;border-top-right-radius:4px}
.bubble small{display:block;font-size:10.5px;color:var(--muted);text-align:right;margin-top:3px}
.composer{position:sticky;bottom:0;display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;min-height:46px;border-radius:99px;border:1.5px solid #CBD6DC;padding:0 16px;font-size:16px;outline:none}
.composer input:focus{border-color:var(--teal)}
.send-btn{width:46px;height:46px;border-radius:50%;border:none;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}

/* Feed mock */
.feed{background:#E9EEF0;flex:1;padding-bottom:10px}
.composer-card{display:flex;align-items:center;gap:10px;background:#fff;padding:12px 14px;margin-bottom:10px}
.composer-card input{flex:1;min-width:0;min-height:44px;border-radius:99px;border:1px solid var(--line);background:var(--soft);padding:0 14px;font-size:16px;outline:none}
.post{background:#fff;margin-bottom:10px;padding-top:12px}
.post-head{display:flex;align-items:center;gap:10px;padding:0 14px}
.post-head b{display:block;font-size:14.5px}
.post-head small{color:var(--muted);font-size:12px}
.post p{padding:0 14px;margin:10px 0;font-size:15px;line-height:1.45}
.post-stats{font-size:12.5px;color:var(--muted);padding:8px 14px}
.post-actions{display:flex;border-top:1px solid var(--line)}
.pa{flex:1;min-height:48px;border:none;background:none;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;color:var(--muted)}
.pa.on{color:var(--teal)}
.pa.on svg{fill:currentColor}
.ph{position:relative;width:100%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.8)}
.ph-tag,.q-tag{position:absolute;left:10px;bottom:10px;font-size:11px;font-weight:800;background:rgba(11,31,51,.72);color:#fff;padding:4px 8px;border-radius:99px}
.q-tag{bottom:auto;top:12px}

/* Photos mock */
.photos{background:#F2F5F6;flex:1}
.stories{display:flex;gap:10px;overflow-x:auto;overscroll-behavior:none;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line)}
.story{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;flex:none;width:68px}
.story-ring{width:62px;height:62px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--mint),var(--teal))}
.story-ring span{display:block;width:100%;height:100%;border-radius:50%;border:3px solid #fff}
.story.seen .story-ring{background:#C8D4DA}
.ig-post{background:#fff;padding-top:10px;margin-bottom:8px}
.ig-actions{display:flex;padding:2px 4px}
.liked{color:#D94F5C}
.liked svg{fill:#D94F5C}
.saved svg{fill:var(--navy)}
.ig-likes{font-weight:800;font-size:14px;padding:0 14px}
.ig-post p{margin:4px 14px 12px;font-size:14.5px;line-height:1.4}

/* Shorts mock */
.shorts{background:#06121E;padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.short{position:relative;height:520px;border-radius:18px;overflow:hidden;color:#fff;cursor:pointer}
.short-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.92}
.short-side{position:absolute;right:10px;bottom:96px;display:flex;flex-direction:column;gap:12px}
.side-btn{width:58px;min-height:58px;border:none;background:rgba(0,0,0,.28);border-radius:16px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700}
.side-btn.liked{color:#FF8A94}
.side-btn.liked svg{fill:#FF8A94}
.short-cap{position:absolute;left:14px;right:84px;bottom:26px;font-size:14px;line-height:1.4;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.short-cap b{display:block;margin-bottom:2px}
.prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.25)}
.prog span{display:block;height:100%;width:0;background:var(--mint)}
.prog.run span{animation:prog 8s linear infinite}
@keyframes prog{from{width:0}to{width:100%}}

/* Video mock */
.yt{background:#fff;flex:1}
.player{position:relative;aspect-ratio:16/9;color:#fff;cursor:pointer}
.player-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.yt-info{padding:12px 16px;border-bottom:1px solid var(--line)}
.yt-info h3{margin:0 0 4px;font-size:17px}
.yt-info small{color:var(--muted)}
.vid-row{display:flex;gap:12px;width:100%;border:none;background:none;text-align:left;padding:8px 16px;align-items:flex-start}
.vid-thumb{position:relative;width:138px;aspect-ratio:16/9;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.vid-thumb em{position:absolute;right:6px;bottom:6px;font-style:normal;font-size:11px;background:rgba(0,0,0,.6);padding:1px 5px;border-radius:4px}
.vid-meta{min-width:0}
.vid-meta b{display:block;font-size:14.5px;line-height:1.3}
.vid-meta small{color:var(--muted);font-size:12px}

/* Site mock */
.site{background:#fff;flex:1}
.urlbar{display:flex;align-items:center;gap:6px;margin:10px 12px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--muted);overflow:hidden;white-space:nowrap}
.site-hero{margin:0 12px;border-radius:18px;padding:24px 20px;color:#fff}
.site-hero small{font-weight:800;opacity:.85;text-transform:uppercase;font-size:11px;letter-spacing:.06em}
.site-hero h2{margin:4px 0 6px;font-size:26px;word-break:break-word}
.site-hero p{margin:0;opacity:.92;font-size:14.5px;line-height:1.45;word-break:break-word}
.site-tabs{display:flex;gap:8px;padding:14px 12px 6px}
.site-tabs button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700}
.site-tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.site-sec{padding:8px 12px 24px}
.art{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.art .ph{aspect-ratio:2/1}
.art-body{padding:12px 14px}
.art-body h4{margin:0 0 6px;font-size:16px}
.art-body p{margin:0 0 6px;color:var(--muted);font-size:14px;line-height:1.45}
.news-row{display:flex;justify-content:space-between;gap:10px;width:100%;border:none;background:none;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);font-size:15px;font-weight:700;min-height:52px}
.news-row small{color:var(--muted);font-weight:600;white-space:nowrap}

/* Center screens */
.center-screen{min-height:100%;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:16px 24px 30px}
.big-ic{width:96px;height:96px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;flex:none}
.big-ic.warn{background:var(--warnbg);color:var(--warn)}
.big-ic.ok{background:var(--greenbg);color:var(--green)}
.big-ic.lock{background:#E3ECF1;color:var(--navy)}
.big-ic.pulse{animation:ring 1.3s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(28,114,147,.35)}100%{box-shadow:0 0 0 22px rgba(28,114,147,0)}}
.center-screen h2{font-size:22px;line-height:1.25;margin:0 0 10px}
.center-screen p{color:var(--muted);line-height:1.5;margin:0 0 20px}
.count{font-size:46px;font-weight:800;color:var(--teal);margin:0 0 18px}
.back-row{position:absolute;top:4px;left:8px}

/* Plans & payment */
.seg{display:flex;background:#E4EBED;border-radius:14px;padding:4px;margin:14px 0 18px}
.seg-btn{flex:1;min-height:44px;border:none;background:none;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted)}
.seg-btn.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(11,31,51,.14)}
.plan{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}
.plan.popular{border:2px solid var(--teal);box-shadow:0 10px 30px rgba(28,114,147,.15)}
.badge{position:absolute;top:-11px;right:16px;background:var(--mint);color:var(--navy);font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:99px}

.current-tag{text-align:center;font-size:12.5px;color:var(--green);font-weight:800;margin-top:9px}
.banner{border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;margin:10px 0;text-align:left}
.banner.warn{background:var(--warnbg);color:#7A4A00}

.summary{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:14px 0}

.opt.on{border-color:var(--teal);background:#F0F8FA}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}

.opt.on .radio{border-color:var(--teal)}

.prov-dot{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex:none}

.big-num{font-size:34px;font-weight:800;letter-spacing:-.02em}
.big-num small{font-size:15px;color:var(--muted);font-weight:700;letter-spacing:0}
.usage-hero .bar.light{height:12px;margin:12px 0 10px}
.u-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:10px}
.app-bar{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.ab-main{flex:1;min-width:0}
.ab-top{display:flex;justify-content:space-between;font-size:14px;font-weight:800;margin-bottom:7px;gap:8px}
.ab-top span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ab-top small{color:var(--muted);font-weight:700;white-space:nowrap}

table{border-collapse:collapse;width:100%;font-size:12px;min-width:330px}
th{text-align:left;background:#F0F4F5;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:9px 6px;white-space:nowrap}
td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}
td b{white-space:nowrap}
td small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
tfoot td{font-weight:800;background:#F5F9F9}
.st{display:inline-block;font-size:10px;font-weight:800;padding:3px 6px;border-radius:99px;white-space:nowrap}
.st.active{background:var(--greenbg);color:var(--green)}
.st.expired{background:var(--dangerbg);color:var(--danger)}
.st.cap{background:var(--warnbg);color:var(--warn)}

.about-list.sim svg{color:var(--warn)}

.sheet-backdrop.open .sheet{transform:none}
.sheet-grip{width:40px;height:5px;border-radius:9px;background:#D3DCE1;margin:4px auto 6px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding-left:6px}
.sheet-head b{font-size:18px}
.sheet-note{font-size:13px;line-height:1.45;background:#E8F1F6;color:#15506A;border-radius:12px;padding:10px 12px;margin:4px 0 8px}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;border:none;background:none;border-radius:12px;padding:0 8px;font-size:16px;font-weight:700;text-align:left}
.menu-item:active{background:var(--soft)}
.mi-ic{width:36px;height:36px;border-radius:10px;background:var(--soft);color:var(--teal);display:flex;align-items:center;justify-content:center;flex:none}
.menu-item.danger{color:var(--danger)}
.menu-item.danger .mi-ic{background:var(--dangerbg);color:var(--danger)}
.toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,20px);background:var(--navy);color:#fff;font-size:14px;font-weight:700;padding:11px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:90;width:max-content;max-width:86%;text-align:center;box-shadow:0 10px 30px rgba(11,31,51,.3)}

var ICON_KEY = 'velovault.icons.v1';
function loadIcons(){
  try { var raw = localStorage.getItem(ICON_KEY); var o = raw ? JSON.parse(raw) : {}; return (o && typeof o === 'object') ? o : {}; }
  catch (e) { return {}; }
}
function saveIcons(){
  try { localStorage.setItem(ICON_KEY, JSON.stringify(icons)); return true; } catch (e) { return false; }
}

/* ---------- Helpers ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ return '$' + n.toFixed(2); }
function mb(n){ return n >= 1023.95 ? (n/1024).toFixed(2).replace(/\.?0+$/, '') + ' GB' : n.toFixed(1) + ' MB'; }
function fmtDate(t){ return new Date(t).toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric'}); }
function fmtShort(t){ return new Date(t).toLocaleDateString('en-US',{month:'short', day:'numeric'}); }
function nowHM(){ var d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function capMB(){ return CAPS_MB[state.plan]; }
function tapRange(){ var t = TAP_MB[state.presentation ? 'presentation' : 'realistic'][state.plan], k = SPEEDS[state.speed].k; return [t[0]*k, t[1]*k]; }
function rangeText(){ var r = tapRange(); if (!r[1]) return '+0 MB per tap (usage off)'; var f = function(n){ return String(Math.round(n*10)/10); };
  return '+' + f(r[0]) + '–' + f(r[1]) + ' MB per ' + (state.presentation ? 'tap' : 'tap or scroll'); }
function daysLeft(){
  if (state.forcedExpired) return 0;
  var d = Math.max(0, Math.ceil((state.expiresAt - Date.now()) / DAY));
  return state.presentation ? Math.max(1, d) : d;   // Presentation mode: never runs out by itself
}
function lockReason(){
  if (!state.signedIn) return null;
  if (state.presentation){                 // only the demo-menu buttons can lock
    if (state.forcedExpired) return 'expired';
    if (state.forcedCap) return 'cap';
    return null;
  }
  if (state.forcedExpired || Date.now() >= state.expiresAt) return 'expired';
  if (state.forcedCap || state.used >= capMB() - 1e-9) return 'cap';
  return null;
}
function getApp(id){ for (var i=0;i<state.apps.length;i++) if (state.apps[i].id === id) return state.apps[i]; return null; }
function initials(n){ var p = n.split(/\s+/).filter(Boolean); return ((p[0]||'?')[0] + (p[1] ? p[1][0] : '')).toUpperCase(); }
function avColor(n){ var h=0; for (var i=0;i<n.length;i++) h=(h*31 + n.charCodeAt(i))>>>0; return AV_COLORS[h % AV_COLORS.length]; }
function tileIcon(a, size){
  return '<span class="letter" style="font-size:'+Math.round(size*0.92)+'px">'+esc(a.name.charAt(0).toUpperCase())+'</span>';
}
function iconSrc(a){
  var s = icons[a.id];
  return (typeof s === 'string' && /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/=]+$/.test(s)) ? s : null;
}
function icBox(a, cls, size){
  var src = iconSrc(a);
  if (src) return '<span class="'+cls+' has-img"><img src="'+src+'" alt=""></span>';
  return '<span class="'+cls+'" style="background:'+a.bg+';color:'+a.fg+'">'+tileIcon(a, size)+'</span>';
}
function provider(id){ for (var i=0;i<PROVIDERS.length;i++) if (PROVIDERS[i].id===id) return PROVIDERS[i]; return PROVIDERS[0]; }
function maskNum(num){ var d = String(num||'').replace(/\D/g,''); return '•••• ' + d.slice(-3); }
function qualityTag(){ return state.plan==='std' ? 'Compressed · about 70% smaller' : state.plan==='prem' ? 'Original quality' : ''; }
function ph(i, ratio){
  var t = qualityTag();
  return '<div class="ph" style="background:'+GRADS[i % GRADS.length]+';aspect-ratio:'+ratio+'">'+ic('image',34)+(t?'<span class="ph-tag">'+t+'</span>':'')+'</div>';
}
function backBtn(act, label){ return '<button class="icon-btn" data-act="'+act+'" aria-label="'+(label||'Back')+'">'+ic('back')+'</button>'; }

var toastT;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('show'); }, 2300);
}

/* ---------- Rendering & navigation ---------- */
var LOCKABLE = ['home','app','add','blocked'];
var TAB_SCREENS = ['home','plans','usage','about','lock'];
var suppressUntil = 0;

function render(){
  var s = state.screen;
  if (lockReason() && LOCKABLE.indexOf(s) >= 0) s = 'lock';
  view.innerHTML = SCREENS[s]();
  view.setAttribute('data-screen', s);
  var showTabs = state.signedIn && TAB_SCREENS.indexOf(s) >= 0;
  tabbar.classList.toggle('hidden', !showTabs);
  $('#screen').classList.toggle('no-tabs', !showTabs);
  var tabs = tabbar.querySelectorAll('.tab');
  for (var i=0;i<tabs.length;i++) tabs[i].classList.toggle('active', tabs[i].getAttribute('data-to') === s);
}
function go(to){
  if (state.screen === 'approve' && to !== 'success' && to !== 'approve') clearTimers();
  var OVERLAY = ['about','admin','icons'];
  if (OVERLAY.indexOf(to) >= 0 && OVERLAY.indexOf(state.screen) < 0){
    state.prevScreen = state.screen === 'approve' ? 'pay' : state.screen;
  }
  if (to === 'plans' && state.screen !== 'plans') state.viewPeriod = state.period;
  state.screen = to;
  suppressUntil = Date.now() + 300;
  render();
  view.scrollTop = 0;
}
function refresh(){
  var st = view.scrollTop;
  suppressUntil = Date.now() + 300;
  render();
  view.scrollTop = st;
}
function scrollBottom(){ suppressUntil = Date.now() + 300; view.scrollTop = view.scrollHeight; }

function openApp(id){
  var a = getApp(id); if (!a) return;
  state.currentApp = id;
  state.mock.chat = null;
  if (lockReason()) return go('lock');
  if (state.plan === 'msg' && a.media) return go('blocked');
  go('app');
}

function addUsage(){
  if (state.screen !== 'app' || !state.currentApp || lockReason()) return;
  var a = getApp(state.currentApp); if (!a) return;
  var cap = capMB();
  var rg = tapRange(), add = Math.round((rg[0] + Math.random()*(rg[1] - rg[0])) * 10) / 10;
  // Presentation mode stops just below the cap so normal tapping can never lock the app
  var room = state.presentation ? Math.max(0, cap - 0.1 - state.used) : cap - state.used;
  var real = Math.round(Math.min(add, room) * 10) / 10;
  if (real <= 0) return;
  state.used += real;
  state.perApp[a.id] = (state.perApp[a.id] || 0) + real;
  var cv = $('#chipval'); if (cv) cv.textContent = mb(state.perApp[a.id]);
  var cp = $('#chipplus');
  if (cp){ cp.textContent = '+' + mb(real); cp.classList.remove('go'); void cp.offsetWidth; cp.classList.add('go'); }
  var am = $('#appmeter'); if (am) am.style.width = Math.min(100, state.used / cap * 100).toFixed(1) + '%';
  if (!state.presentation && state.used >= cap - 1e-9){
    state.used = cap;
    toast('Data cap reached. Speed reduced.');
    timers.push(setTimeout(function(){ if (state.screen === 'app') go('lock'); }, 700));
  }
}

function activate(plan, period){
  var now = Date.now();
  state.plan = plan; state.period = period;
  state.cycleStart = now; state.expiresAt = now + PERIODS[period].days * DAY;
  state.used = 0; state.perApp = {}; state.forcedExpired = false; state.forcedCap = false;
}

function parseHost(raw){
  var h = String(raw || '').trim().toLowerCase().replace(/^[a-z][a-z0-9+.-]*:\/\//, '').split(/[\/?#\s]/)[0].replace(/:\d+$/, '').replace(/^www\./, '');
  return /^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(h) && h.length <= 80 ? h : null;
}
function siteName(host){
  var parts = host.split('.'), p = parts[0];
  if (['m','mobile','web','app','en'].indexOf(p) >= 0 && parts.length > 2) p = parts[1];
  return p.charAt(0).toUpperCase() + p.slice(1);
}

    '<div style="padding:2px 8px 6px"><b style="font-size:14px">Demo usage speed</b>'+
      '<div class="seg" style="margin:8px 0 6px">'+['off','slow','normal','fast'].map(function(k){
        return '<button class="seg-btn'+(state.speed===k?' on':'')+'" data-act="speed" data-v="'+k+'">'+SPEEDS[k].label+'</button>'; }).join('')+'</div>'+
      '<small class="muted" style="font-size:12.5px">Off adds nothing · Slow is half · Fast is 5 times Normal. Caps: Standard 6144 MB, Premium 20480 MB, Message & Calls 20 MB (demo).</small></div>'+
    '<button class="menu-item" data-act="ff"><span class="mi-ic">'+ic('forward',20)+'</span>Fast-forward to end of plan</button>'+
    '<button class="menu-item" data-act="usecap"><span class="mi-ic">'+ic('data',20)+'</span>Use up data cap</button>'+
    '<button class="menu-item" data-act="edit-icons"><span class="mi-ic">'+ic('image',20)+'</span>Edit icons</button>'+
    '<button class="menu-item" data-act="admin"><span class="mi-ic">'+ic('table',20)+'</span>Admin view</button>'+
    '<button class="menu-item" data-act="about"><span class="mi-ic">'+ic('info',20)+'</span>About this demo</button>'+
    '<button class="menu-item danger" data-act="reset"><span class="mi-ic">'+ic('reset',20)+'</span>Reset demo</button>'+
  '</div>';
  menuEl.classList.add('open'); menuEl.setAttribute('aria-hidden','false');
}
function closeMenu(){ menuEl.classList.remove('open'); menuEl.setAttribute('aria-hidden','true'); }

/* ---------- Actions ---------- */
function findById(list, id){ for (var i=0;i<list.length;i++) if (list[i].id === id) return list[i]; return null; }
var ACT = {
  go: function(el){ go(el.getAttribute('data-to')); },
  'go-plans': function(){ go('plans'); },
  'back-prev': function(){ go(state.prevScreen || (state.signedIn ? 'home' : 'onboard')); },
  menu: function(){ openMenu(); },
  'menu-close': function(){ closeMenu(); },

  'ob-next': function(){ if (state.ob < OB.length - 1){ state.ob++; refresh(); } else go('signin'); },
  'ob-back': function(){ if (state.ob > 0){ state.ob--; refresh(); } },
  'ob-skip': function(){ go('signin'); },
  'ob-return': function(){ state.ob = OB.length - 1; go('onboard'); },
  signin: function(){
    var d = String(state.phone || '').replace(/\D/g, '');
    if (d.length < 4){ state.signinErr = 'Enter any phone number (at least 4 digits). No SMS is sent.'; refresh(); return; }
    state.signinErr = ''; state.signedIn = true;

  },

  'open-app': function(el){ openApp(el.getAttribute('data-id')); },
  'back-home': function(){ state.mock.chat = null; go('home'); },
  upgrade: function(){ go('plans'); },

  'chat-open': function(el){
    var c = findById(state.mock.chats, el.getAttribute('data-id')); if (!c) return;
    c.unread = 0; state.mock.chat = c.id; refresh(); scrollBottom();
  },
  'chat-back': function(){ state.mock.chat = null; refresh(); view.scrollTop = 0; },
  'chat-send': function(){
    var inp = $('#chatin'), t = inp ? inp.value.trim() : '';
    var c = findById(state.mock.chats, state.mock.chat); if (!c) return;
    if (!t){ toast('Type a message first'); return; }
    c.msgs.push({me:true, t:t, at:nowHM()}); c.time = nowHM(); inp.value = '';
    var box = $('#msgs'); if (box) box.innerHTML = msgsHTML(c); scrollBottom();
    var id = c.id;
    timers.push(setTimeout(function(){
      c.msgs.push({me:false, t:REPLIES[Math.floor(Math.random()*REPLIES.length)], at:nowHM()});
      if (state.screen === 'app' && state.mock.chat === id){ var b = $('#msgs'); if (b){ b.innerHTML = msgsHTML(c); scrollBottom(); } }
    }, 1300));
  },
  call: function(){ toast('Voice call started (simulated, no real call)'); },

  like: function(el){ var p = findById(state.mock.posts, el.getAttribute('data-id')); if (!p) return; p.liked = !p.liked; p.likes += p.liked ? 1 : -1; refresh(); },
  comment: function(el){ var p = findById(state.mock.posts, el.getAttribute('data-id')); if (p){ p.comments++; refresh(); } toast('Comment added (simulated)'); },
  share: function(){ toast('Share sheet (simulated)'); },
  'fb-post': function(){
    var inp = $('#fbin'), t = inp ? inp.value.trim() : '';
    if (!t){ toast('Write something first'); return; }
    state.mock.posts.unshift({id:'p'+Date.now(), author:'You', time:'Just now', text:t, img:null, likes:0, comments:0});
    refresh(); toast('Posted (only visible in this demo)');
  },
  story: function(el){ state.mock.seen[el.getAttribute('data-i')] = true; refresh(); toast('Story viewed (simulated)'); },
  'ig-like': function(el){ var p = findById(state.mock.ig, el.getAttribute('data-id')); if (!p) return; p.liked = !p.liked; p.likes += p.liked ? 1 : -1; refresh(); },
  'ig-save': function(el){ var p = findById(state.mock.ig, el.getAttribute('data-id')); if (!p) return; p.saved = !p.saved; refresh(); toast(p.saved ? 'Saved' : 'Removed from saved'); },
  'short-toggle': function(el){ var s = findById(state.mock.shorts, el.getAttribute('data-id')); if (!s) return; s.playing = !s.playing; refresh(); },
  'short-like': function(el){ var s = findById(state.mock.shorts, el.getAttribute('data-id')); if (!s) return; s.liked = !s.liked; s.likes += s.liked ? 1 : -1; refresh(); },
  'vid-toggle': function(){ state.mock.vidPlaying = !state.mock.vidPlaying; refresh(); },
  'vid-pick': function(el){ state.mock.vid = +el.getAttribute('data-i'); state.mock.vidPlaying = true; refresh(); view.scrollTop = 0; },
  'site-tab': function(el){ var a = getApp(state.currentApp); if (!a) return; state.mock.site[a.id].tab = el.getAttribute('data-t'); refresh(); },
  'site-more': function(el){ var a = getApp(state.currentApp); if (!a) return; var o = state.mock.site[a.id].open, i = el.getAttribute('data-i'); o[i] = !o[i]; refresh(); },
  'site-news': function(el){ toast('Opened sample headline '+el.getAttribute('data-i')+' (mock)'); },

  'add-suggest': function(el){ state.addVal = el.getAttribute('data-v'); state.addErr = ''; refresh(); },
  'add-site': function(){
    var host = parseHost(state.addVal);
    if (!host){ state.addErr = 'Enter a website address like example.com'; refresh(); return; }
    var a = null;
    for (var i=0;i<state.apps.length;i++) if (state.apps[i].host === host) a = state.apps[i];
    if (!a){
      state.siteCount++;
      a = {id:'site'+state.siteCount, name:siteName(host), host:host, kind:'site', icon:'globe', media:false, custom:true, hue:(state.siteCount*3) % GRADS.length, bg:'#E3EEF1', fg:'#1C7293'};
      state.apps.push(a); toast(a.name + ' added to your sandbox');
    } else toast(a.name + ' is already in your sandbox');
    state.addVal = ''; state.addErr = '';
    openApp(a.id);
  },

  period: function(el){ state.viewPeriod = el.getAttribute('data-p'); refresh(); },
  choose: function(el){
    state.pay = {plan:el.getAttribute('data-plan'), period:state.viewPeriod, provider:state.pay.provider || 'orange', number:state.pay.number || '', error:''};
    go('pay');
  },
  renew: function(){
    state.pay = {plan:state.plan, period:state.period, provider:state.pay.provider || 'orange', number:state.pay.number || '', error:''};
    go('pay');
  },
  provider: function(el){ state.pay.provider = el.getAttribute('data-v'); refresh(); },
  'pay-submit': function(){
    var d = String(state.pay.number || '').replace(/\D/g, '');
    if (d.length < 6){ state.pay.error = 'Enter a Mobile Money number (at least 6 digits). Any number works.'; refresh(); return; }
    state.pay.error = '';
    clearTimers();
    state.approveLeft = 3;
    go('approve');
    timers.push(setInterval(function(){
      state.approveLeft = Math.max(0, state.approveLeft - 1);
      var el = $('#count'); if (el) el.textContent = state.approveLeft;
    }, 1000));
    timers.push(setTimeout(function(){
      clearTimers();
      var p = state.pay, pl = PLANS[p.plan];
      activate(p.plan, p.period);
      var ref = 'TEST-' + Math.random().toString(36).slice(2, 8).toUpperCase();
      state.receipt = {plan:pl.name, period:PERIODS[p.period].label, amount:money(pl.prices[p.period]), provider:provider(p.provider).label, ref:ref, until:fmtDate(state.expiresAt)};
      go('success'); toast(pl.name + ' plan activated');
    }, 3000));
  },
  'pay-cancel': function(){ clearTimers(); toast('Payment cancelled'); go('pay'); },

  ff: function(){
    closeMenu();
    if (!state.signedIn){ toast('Sign in first to try this'); return; }
    clearTimers();
    state.expiresAt = Date.now() - 1000; state.forcedExpired = true;
    toast('Fast-forwarded to the end of the plan'); go('lock');
  },
  usecap: function(){
    closeMenu();
    if (!state.signedIn){ toast('Sign in first to try this'); return; }
    clearTimers();
    var cap = capMB(), rem = cap - state.used;
    if (rem > 0){
      var ok = state.apps.filter(function(a){ return !(state.plan === 'msg' && a.media); });
      var w = ok.map(function(){ return Math.random() + 0.2; }), sum = w.reduce(function(x,y){ return x + y; }, 0);
      ok.forEach(function(a, i){ state.perApp[a.id] = (state.perApp[a.id] || 0) + rem * w[i] / sum; });
    }
    state.used = cap; state.forcedCap = true;
    toast('Data cap used up'); go('lock');
  },
  admin: function(){ closeMenu(); go('admin'); },
  'edit-icons': function(){ closeMenu(); go('icons'); },
  speed: function(el){ state.speed = el.getAttribute('data-v'); openMenu(); toast('Demo usage speed: ' + SPEEDS[state.speed].label); },
  presentation: function(){
    state.presentation = !state.presentation;
    // leaving Presentation mode keeps things unlocked until you tap again
    if (!state.presentation && state.used >= capMB() - 1e-9 && !state.forcedCap) state.used = capMB() - 0.1;
    openMenu(); refresh(); toast('Presentation mode ' + (state.presentation ? 'on' : 'off'));
  },
  'icon-pick': function(el){
    pendingIcon = el.getAttribute('data-id');
    var f = $('#iconFile'); f.value = ''; f.click();
  },
  'icon-remove': function(el){
    var a = getApp(el.getAttribute('data-id')); if (!a) return;
    delete icons[a.id]; saveIcons(); refresh(); toast(a.name + ' is back to its letter tile');
  },
  'icons-reset': function(el){
    if (!Object.keys(icons).length){ toast('No custom icons to reset'); return; }
    if (Date.now() - resetArmed > 4000){
      resetArmed = Date.now();
      el.textContent = 'Tap again to remove all icons';
      setTimeout(function(){ var b = document.querySelector('[data-act="icons-reset"]'); if (b && Date.now() - resetArmed >= 3900) b.textContent = 'Reset icons'; }, 4000);
      return;
    }
    resetArmed = 0; icons = {};
    try { localStorage.removeItem(ICON_KEY); } catch (e) {}
    refresh(); toast('Icons reset to letter tiles');
  },
  'crop-cancel': function(){ closeCropper(); },
  'crop-save': function(){ saveCrop(); },
  'crop-zoom-in': function(){ if (crop) setZoom(crop.zoom * 1.2, CV / 2, CV / 2); },
  'crop-zoom-out': function(){ if (crop) setZoom(crop.zoom / 1.2, CV / 2, CV / 2); },
  about: function(){ closeMenu(); go('about'); },
  reset: function(){ closeMenu(); closeCropper(); clearTimers(); state = freshState(); go('onboard'); toast('Demo reset'); }
};

/* ---------- Icon picker & cropper ---------- */
var pendingIcon = null, resetArmed = 0, crop = null, CV = 260, OUT = 192;
var cropEl = $('#cropper');
function dpr(){ return Math.min(3, window.devicePixelRatio || 1); }
function rrPath(c, x, y, w, h, r){
  c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}
$('#iconFile').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0], appId = pendingIcon;
  if (!f || !appId) return;
  if (f.type && !/^image\//.test(f.type)){ toast('Please choose an image file'); return; }
  var url = URL.createObjectURL(f), img = new Image();
  img.onload = function(){ URL.revokeObjectURL(url); openCropper(appId, img); };
  img.onerror = function(){ URL.revokeObjectURL(url); toast('Could not read that image. Try a PNG or JPG.'); };
  img.src = url;
});
function openCropper(appId, img){
  var a = getApp(appId), w = img.naturalWidth, h = img.naturalHeight;
  if (!a || !w || !h){ toast('Could not read that image. Try a PNG or JPG.'); return; }
  var k = Math.min(1, 1200 / Math.max(w, h)), src = document.createElement('canvas');
  src.width = Math.max(1, Math.round(w * k)); src.height = Math.max(1, Math.round(h * k));
  src.getContext('2d').drawImage(img, 0, 0, src.width, src.height);
  var base = Math.max(CV / src.width, CV / src.height), d = dpr();
  crop = {app:appId, src:src, w:src.width, h:src.height, base:base, zoom:1,
          x:(CV - src.width * base) / 2, y:(CV - src.height * base) / 2, ptrs:{}, start:null};
  cropEl.innerHTML =
    '<span class="demo-pill"><i></i>Interactive demo - simulated</span>'+
    '<h3>Crop the '+esc(a.name)+' icon</h3>'+
    '<p>Drag to move the image. Pinch, scroll or use the slider to zoom.</p>'+
    '<div class="crop-stage"><canvas id="cropCv" width="'+Math.round(CV * d)+'" height="'+Math.round(CV * d)+'"></canvas></div>'+
    '<div class="crop-zoom"><button data-act="crop-zoom-out" aria-label="Zoom out">−</button>'+
      '<input id="cropZoom" type="range" min="1" max="5" step="0.01" value="1" aria-label="Zoom">'+
      '<button data-act="crop-zoom-in" aria-label="Zoom in">+</button></div>'+
    '<div class="crop-prev"><canvas id="cropPv" width="'+Math.round(52 * d)+'" height="'+Math.round(52 * d)+'"></canvas>'+
      '<div><b>'+esc(a.name)+'</b><br><small style="opacity:.75">Tile preview</small></div></div>'+
    '<div class="crop-actions"><button class="btn ghost" data-act="crop-cancel">Cancel</button>'+
      '<button class="btn mint" data-act="crop-save">Use this icon</button></div>';
  cropEl.classList.add('open'); cropEl.setAttribute('aria-hidden', 'false');
  var cv = $('#cropCv');
  cv.addEventListener('pointerdown', function(e){
    e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    crop.ptrs[e.pointerId] = {x:e.clientX, y:e.clientY}; crop.start = null;
  });
  cv.addEventListener('pointermove', function(e){
    if (!crop || !crop.ptrs[e.pointerId]) return;
    var prev = crop.ptrs[e.pointerId], ids = Object.keys(crop.ptrs);
    crop.ptrs[e.pointerId] = {x:e.clientX, y:e.clientY};
    if (ids.length >= 2){
      var p1 = crop.ptrs[ids[0]], p2 = crop.ptrs[ids[1]];
      var dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
      var r = cv.getBoundingClientRect(), sc = CV / r.width;
      var mid = {x:((p1.x + p2.x) / 2 - r.left) * sc, y:((p1.y + p2.y) / 2 - r.top) * sc};
      if (!crop.start) crop.start = {dist:dist, zoom:crop.zoom};
      else setZoom(crop.start.zoom * dist / Math.max(1, crop.start.dist), mid.x, mid.y);
    } else {
      var rr = cv.getBoundingClientRect(), s2 = CV / rr.width;
      crop.x += (e.clientX - prev.x) * s2; crop.y += (e.clientY - prev.y) * s2;
      drawCrop();
    }
  });
  function up(e){ if (crop){ delete crop.ptrs[e.pointerId]; crop.start = null; } }
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', function(e){
    e.preventDefault();
    var r = cv.getBoundingClientRect(), sc = CV / r.width;
    setZoom(crop.zoom * Math.exp(-e.deltaY * 0.0015), (e.clientX - r.left) * sc, (e.clientY - r.top) * sc);
  }, {passive:false});
  drawCrop();
}
function clampCrop(){
  var s = crop.base * crop.zoom;
  crop.x = Math.min(0, Math.max(CV - crop.w * s, crop.x));
  crop.y = Math.min(0, Math.max(CV - crop.h * s, crop.y));
}
function setZoom(z, cx, cy){
  if (!crop) return;
  z = Math.max(1, Math.min(5, z));
  var s0 = crop.base * crop.zoom, s1 = crop.base * z;
  crop.x = cx - (cx - crop.x) * s1 / s0; crop.y = cy - (cy - crop.y) * s1 / s0; crop.zoom = z;
  var zi = $('#cropZoom'); if (zi) zi.value = z.toFixed(2);
  drawCrop();
}
function paintCrop(ctx, size){
  var k = size / CV, s = crop.base * crop.zoom;
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, size, size);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(crop.src, crop.x * k, crop.y * k, crop.w * s * k, crop.h * s * k);
}
function drawCrop(){
  if (!crop) return;
  clampCrop();
  var d = dpr(), cv = $('#cropCv'), pv = $('#cropPv');
  if (cv){ var c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0); paintCrop(c, CV); }
  if (pv){ var c2 = pv.getContext('2d'); c2.setTransform(d, 0, 0, d, 0, 0); paintCrop(c2, 52); }
}
function closeCropper(){
  crop = null; cropEl.classList.remove('open'); cropEl.setAttribute('aria-hidden', 'true'); cropEl.innerHTML = '';
}
function saveCrop(){
  if (!crop) return;
  var out = document.createElement('canvas'); out.width = out.height = OUT;
  var o = out.getContext('2d');
  rrPath(o, 0, 0, OUT, OUT, OUT * 0.22); o.clip();
  clampCrop(); paintCrop(o, OUT);
  var a = getApp(crop.app), url;
  try { url = out.toDataURL('image/png'); } catch (e) { toast('Could not save that image'); return; }
  icons[a.id] = url;
  var ok = saveIcons();
  closeCropper(); refresh();
  toast(ok ? a.name + ' icon saved' : a.name + ' icon set for this visit only (browser storage is not available)');
}

/* ---------- Events ---------- */
document.addEventListener('click', function(e){
  if (e.target === menuEl){ closeMenu(); return; }
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  var inApp = state.screen === 'app' && !!(e.target.closest && e.target.closest('#appbody'));
  if (el){ var fn = ACT[el.getAttribute('data-act')]; if (fn) fn(el, e); }
  if (inApp) addUsage();
});
document.addEventListener('keydown', function(e){
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var t = e.target;
  if (e.key === 'Enter' && t && t.getAttribute && t.getAttribute('data-enter')){
    e.preventDefault();
    var fn = ACT[t.getAttribute('data-enter')];
    if (fn){ fn(t, e); if (state.screen === 'app' && !state.presentation) addUsage(); }
    return;
  }
  if (t && t.getAttribute && t.getAttribute('role') === 'button' && t.getAttribute('data-act')){ e.preventDefault(); t.click(); }
});
document.addEventListener('input', function(e){
  if (e.target && e.target.id === 'cropZoom'){ setZoom(parseFloat(e.target.value), CV / 2, CV / 2); return; }
  var k = e.target && e.target.getAttribute && e.target.getAttribute('data-bind');
  if (!k) return;
  var parts = k.split('.'), o = state;
  for (var i=0;i<parts.length-1;i++) o = o[parts[i]];
  o[parts[parts.length-1]] = e.target.value;
});
var lastScroll = 0;
view.addEventListener('scroll', function(){
  if (state.screen !== 'app' || state.presentation) return;   // scrolling never counts in Presentation mode
  var now = Date.now();
  if (now < suppressUntil || now - lastScroll < 650) return;
  lastScroll = now; addUsage();
}, {passive:true});

/* ---------- Chrome setup ---------- */
$('#menuBtn').innerHTML = ic('dots', 22);
[['home','home','Home'],['plans','card','Plans'],['usage','chart','Usage'],['about','info','About']].forEach(function(t){
  $('#tab-' + t[0]).innerHTML = ic(t[1], 24) + '<span>' + t[2] + '</span>';
});
function tick(){ $('#clock').textContent = nowHM(); }
tick(); setInterval(tick, 30000);
var PHONE_MQ = window.matchMedia('(max-width:520px), (pointer:coarse) and (max-height:520px)');
function fit(){
  var ph = $('#phone');
  if (PHONE_MQ.matches){ ph.style.transform = ''; ph.style.marginBottom = ''; return; }
  var s = Math.min(1, (window.innerHeight - 70) / 868, (window.innerWidth - 20) / 414);
  ph.style.transform = s < 1 ? 'scale(' + s + ')' : '';
  ph.style.marginBottom = s < 1 ? (-(868 * (1 - s))) + 'px' : '';
}
window.addEventListener('resize', fit); fit();

render();
})();
